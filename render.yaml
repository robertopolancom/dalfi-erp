services:
  - type: web
    name: dalfi-erp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Orígenes que pueden llamar a /api/fast-booking y /api/reservapp. El hostname viejo
      # (reservapp.sebengroup.com) se retiró en el corte limpio del 2026-09-04.
      # Este servicio es Blueprint managed: render.yaml MANDA y sobrescribe cualquier
      # edición hecha a mano en el dashboard de Render.
      - key: FAST_BOOKING_ORIGIN
        value: https://reservapp.dalfistudio.com
      - key: FAST_BOOKING_HOST
        value: reservapp.dalfistudio.com
      - key: SEBEN_SUITE_HOST
        value: ssc.dalfistudio.com
      # Orígenes que pueden LEER GET /api/site-content/:siteKey (el contenido que el
      # personal edita desde el panel "Página web" del ERP). La misma página de Nails se
      # sirve desde la raíz, www y nails a la vez. El cuarto de la lista,
      # dalfistudionails.sebengroup.com, SIGUE VIVO a propósito: es el sitio que Meta puede
      # estar visitando durante la verificación de empresa, en revisión desde principios de
      # septiembre de 2026. Quitarlo SOLO cuando Meta apruebe, y en el orden que explica
      # docs/PENDIENTES.md (sección 1) -- cambiar el sitio en Business Manager antes de que
      # aprueben reinicia la revisión desde cero.
      - key: SITE_CONTENT_ALLOWED_ORIGIN
        value: https://dalfistudio.com,https://www.dalfistudio.com,https://nails.dalfistudio.com,https://dalfistudionails.sebengroup.com
      - key: RESERVAPP_PUBLIC_URL
        value: https://reservapp.dalfistudio.com
      - key: CHATBOT_BRIDGE_URL
        value: https://bot.dalfistudio.com
      - key: ERP_WEBHOOK_SECRET
        sync: false
      # Firma los enlaces públicos de factura (GET /factura/:token). Si falta, el servidor cae al
      # ERP_WEBHOOK_SECRET; sin ninguno de los dos no se emiten enlaces. Ver server/invoice-link.mjs.
      - key: INVOICE_LINK_SECRET
        generateValue: true
      - key: CHATBOT_SECRET
        sync: false
      - key: DEPOSIT_REVIEW_REMINDER_CRON_SECRET
        sync: false
      # Credencial del Worker dalfi-erp-closing-cron (Cron Trigger 23:59 Santo Domingo) para
      # llamar a POST /api/run-closing-catchup, que genera los cierres diarios que falten sin
      # depender de que nadie abra el ERP. Tiene que ser EXACTAMENTE el mismo valor que el
      # secret CLOSING_CRON_SECRET del Worker ("wrangler secret put" en workers/closing-cron).
      # Mientras esta variable no exista, la ruta responde 503 y no hace nada -- el cron falla
      # sin romper nada y los cierres los sigue creando el navegador al abrir el ERP.
      - key: CLOSING_CRON_SECRET
        sync: false
      # Avisos por correo al personal (nueva reserva, comprobante subido, recordatorio
      # horario) -- Gmail SMTP con contraseña de aplicación, ver server/email.mjs.
      # Transporte de los avisos por correo. Render bloquea la salida SMTP (comprobado el
      # 2026-09-06: 587 y 465, los dos con Connection timeout desde el contenedor, ya con la IPv4
      # correcta), así que Gmail no sirve desde aquí y se manda por la API HTTP de Resend.
      # RESEND_FROM tiene que ser un remitente de un dominio VERIFICADO en Resend
      # ("Dalfi Studio Nails <info@dalfistudio.com>"); si no, Resend rechaza el envío.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # GMAIL_* se quedan para correr fuera de Render (local, u otro alojamiento): si hay
      # RESEND_API_KEY, gana Resend y estas ni se miran.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # TEMPORAL: en "true" salta la verificación de WhatsApp del autorregistro en ReservApp
      # mientras Meta aprueba WHATSAPP_ACTIVATION_TEMPLATE_NAME (dalfi-chatbot-n8n). Quitar esta
      # var (o ponerla en "false") apenas la plantilla esté aprobada y el envío funcione de
      # nuevo -- ver comentario junto a su uso en server/app.mjs.
      - key: RESERVAPP_SKIP_PHONE_VERIFICATION
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
