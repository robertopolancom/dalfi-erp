services:
  - type: web
    name: dalfi-erp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Orígenes que pueden llamar a /api/fast-booking y /api/reservapp. Durante la
      # migración ReservApp vive en los dos dominios a la vez; en el corte limpio se quita
      # el segundo. Este servicio es Blueprint managed: render.yaml MANDA y sobrescribe
      # cualquier edición hecha a mano en el dashboard de Render.
      - key: FAST_BOOKING_ORIGIN
        value: https://reservapp.dalfistudio.com,https://reservapp.sebengroup.com
      - key: FAST_BOOKING_HOST
        value: reservapp.dalfistudio.com
      - key: SEBEN_SUITE_HOST
        value: sebensuiteconnect.dalfistudio.com
      # Orígenes que pueden LEER GET /api/site-content/:siteKey (el contenido que el
      # personal edita desde el panel "Página web" del ERP). La misma página de Nails se
      # sirve desde la raíz, www y nails a la vez, y durante la migración también desde el
      # hostname viejo. En el corte limpio se borra el último de la lista; si se borra la
      # variable entera, el código cae al valor por defecto, que ya son los tres nuevos.
      - key: SITE_CONTENT_ALLOWED_ORIGIN
        value: https://dalfistudio.com,https://www.dalfistudio.com,https://nails.dalfistudio.com,https://dalfistudionails.sebengroup.com
      - key: RESERVAPP_PUBLIC_URL
        value: https://reservapp.dalfistudio.com
      - key: CHATBOT_BRIDGE_URL
        value: https://bot.dalfistudio.com
      - key: ERP_WEBHOOK_SECRET
        sync: false
      - key: CHATBOT_SECRET
        sync: false
      - key: DEPOSIT_REVIEW_REMINDER_CRON_SECRET
        sync: false
      # Avisos por correo al personal (nueva reserva, comprobante subido, recordatorio
      # horario) -- Gmail SMTP con contraseña de aplicación, ver server/email.mjs.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      # TEMPORAL: en "true" salta la verificación de WhatsApp del autorregistro en ReservApp
      # mientras Meta aprueba WHATSAPP_ACTIVATION_TEMPLATE_NAME (dalfi-chatbot-n8n). Quitar esta
      # var (o ponerla en "false") apenas la plantilla esté aprobada y el envío funcione de
      # nuevo -- ver comentario junto a su uso en server/app.mjs.
      - key: RESERVAPP_SKIP_PHONE_VERIFICATION
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
