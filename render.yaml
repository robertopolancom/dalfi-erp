services:
  - type: web
    name: dalfi-erp
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FAST_BOOKING_ORIGIN
        value: https://reservapp.sebengroup.com
      - key: FAST_BOOKING_HOST
        value: reservapp.sebengroup.com
      - key: SEBEN_SUITE_HOST
        value: ssc.sebengroup.com
      - key: RESERVAPP_PUBLIC_URL
        value: https://reservapp.sebengroup.com
      - key: CHATBOT_BRIDGE_URL
        value: https://bot.sebengroup.com
      - key: ERP_WEBHOOK_SECRET
        sync: false
      - key: CHATBOT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
