# =============================================================================
# RETIRADO 2026-09-04. NO DESPLEGAR. NO TERMINAR.
#
# Esto NO es un Worker a medias: se borro de Cloudflare a proposito y el codigo
# se conserva solo como registro. El porque esta en README.md, y la decision de
# fondo es de Roberto (confirmada el 2026-09-04): Google Calendar es un espejo
# de SOLO LECTURA. El ERP es la unica fuente de verdad y empuja a Google con
# syncChangedAppointmentsToGoogleCalendar(); traer de vuelta Google -> ERP, que
# es justo lo que hacia este cron, convertiria el calendario en una segunda
# fuente editable.
#
# Si una sesion futura propone revivirlo, la respuesta por defecto es NO. Antes
# de investigar nada desde cero, leer README.md: ahi esta todo.
#
# (Comprobado de nuevo el 2026-09-15: no existe en la cuenta -- code 10007 --,
# /api/calendar/google-pull responde 404, y su cron era cada minuto.)
# =============================================================================

# RETIRADO 2026-09-04 -- este Worker ya no existe en Cloudflare, ver README.md.
# Se conserva el archivo para que quede constancia de cómo estaba configurado.
name = "dalfi-erp-calendar-sync-cron"
main = "worker.js"
compatibility_date = "2026-07-09"

# Este Worker solo tiene manejador `scheduled`: no atiende peticiones HTTP de nadie. Sin estas
# dos lineas, wrangler le habilita por defecto una URL publica (*.workers.dev) y URLs de vista
# previa que no sirven para nada y son superficie de mas.
workers_dev = false
preview_urls = false

[vars]
# Apuntaba a dalfi-erp.pages.dev, un proyecto borrado el 2026-08-24. Si algún día
# se revive, va https://ssc.dalfistudio.com -- pero antes hay que
# escribir /api/calendar/google-pull en server/app.mjs, que hoy no existe.
APP_BASE_URL = "https://ssc.dalfistudio.com"

# Disparaba CADA MINUTO. 1.440 invocaciones fallidas al día durante 11 días.
[triggers]
crons = ["* * * * *"]
