name: Deploy bandeja del personal (PWA)

# La PWA de la bandeja es un Worker de assets estáticos, igual que ReservApp y el sitio público.
# IMPORTANTE: ninguno de esos tres los despliega Cloud Build. Un push al repo NO los publica --
# eso ya costó once días de un botón de factura roto sin que nadie lo notara. Este workflow existe
# para que este no dependa de que alguien se acuerde de correr wrangler a mano.
#
# No maneja ningún secreto de la aplicación: la PWA solo lleva configuración pública (ver
# outputs/inbox/config.js) y pide la clave de notificaciones al servidor con sesión iniciada.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-inbox.yml
      - outputs/inbox/**

permissions:
  contents: read

concurrency:
  group: cloudflare-inbox-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.122.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install and test
        run: |
          npm ci
          node --test tests/bandeja-pwa.test.js
          node --check outputs/inbox/app.js
          node --check outputs/inbox/sw.js
          node --check outputs/inbox/transporte.js

      # Se publica en dos pasos en vez de con `wrangler deploy`, y no es un capricho.
      #
      # `deploy` reconcilia ADEMAS los disparadores: el dominio propio de wrangler.jsonc. Eso
      # necesita permisos de ZONA sobre dalfistudio.com (Workers Routes), y el token del CI no
      # los tiene. El resultado era lo peor de los dos mundos: subia el codigo y despues moria
      # con "Authentication error [code: 10000]", dejando el workflow siempre en rojo. Un
      # workflow siempre rojo es lo mismo que no tener workflow, porque nadie lo mira.
      #
      # `versions upload` + `versions deploy` publican el codigo y NO tocan los disparadores.
      # inbox.dalfistudio.com ya esta enganchado al Worker y no cambia nunca, asi que no hay nada
      # que reconciliar en cada push. El token del CI se queda con lo minimo para publicar, que
      # es como tiene que ser.
      #
      # Lo que esto implica: si algun dia cambia `routes` en wrangler.jsonc, el CI NO lo aplicara.
      # Ese cambio se hace a mano una vez, con una credencial que si tenga permisos de zona.
      - name: Deploy Worker
        working-directory: outputs/inbox
        run: |
          set -euo pipefail
          # `versions deploy` sin argumentos abre un menu interactivo y en CI muere con "You must
          # select at least 1 version". Hay que pasarle el id de LO QUE SE ACABA DE SUBIR, que es
          # ademas lo correcto: asi no se promociona por accidente una version de otra rama.
          salida="$(npx --yes wrangler@${WRANGLER_VERSION} versions upload 2>&1)"
          printf '%s\n' "$salida"
          version="$(printf '%s' "$salida" | grep -oE 'Worker Version ID: [0-9a-f-]{36}' | head -1 | awk '{print $NF}')"
          test -n "$version" || { echo "No se pudo leer el id de la version subida"; exit 1; }
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy "$version" --yes

      # Comprobar que lo desplegado es lo que se acaba de subir, y no la versión anterior. El
      # "Success" de wrangler ya ha mentido antes: dice "1 file uploaded" aunque no cambie nada.
      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://inbox.dalfistudio.com"
          code=$(curl -s -o /tmp/inbox.html -w "%{http_code}" --max-time 20 "$url" || true)
          test "$code" = "200" || { echo "La bandeja respondió $code"; exit 1; }
          grep -q 'id="pantalla-lista"' /tmp/inbox.html || { echo "El HTML servido no es el de la bandeja"; exit 1; }
          curl -sf --max-time 20 "$url/manifest.webmanifest" > /dev/null || { echo "Falta el manifest"; exit 1; }
          curl -sf --max-time 20 "$url/sw.js" > /dev/null || { echo "Falta el service worker"; exit 1; }
          echo "Bandeja publicada y verificada."
