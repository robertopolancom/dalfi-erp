name: Activate booking reminder cron

# dalfi-erp.pages.dev (Cloudflare Pages + Supabase) fue eliminado -- el motor de recordatorios
# vive ahora en server/app.mjs (POST /api/booking/send-reminders, Render, ssc.dalfistudio.com).
# Este workflow ya NO despliega ningún proyecto de Pages ni rota el secreto: BOOKING_REMINDER_CRON_SECRET
# se administra a mano en el dashboard de Render (mismo valor que el secret de GitHub de abajo),
# igual que cualquier otra variable de entorno de ese servicio. Solo despliega el Worker (Cron
# Trigger) y verifica que el contrato del endpoint siga funcionando end-to-end.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-booking-reminder.yml
      - workers/booking-reminder-cron/**

permissions:
  contents: read

concurrency:
  group: cloudflare-booking-reminder-production
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOOKING_REMINDER_CRON_SECRET: ${{ secrets.BOOKING_REMINDER_CRON_SECRET }}
      APP_BASE_URL: https://ssc.dalfistudio.com
      WORKER_NAME: dalfi-erp-booking-reminder-cron
      WRANGLER_VERSION: 4.122.0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          # BOOKING_REMINDER_CRON_SECRET es OPCIONAL a proposito. Exigirlo dejo este workflow en
          # rojo desde el 2026-08-13, y lo unico que se ganaba era tener una copia mas del secreto
          # de produccion guardada tambien en GitHub. El Worker ya lo tiene: desplegar codigo NO
          # borra los secretos de un Worker.
          if [ -n "$BOOKING_REMINDER_CRON_SECRET" ]; then
            echo "Secreto presente: se rotara en el Worker y se verificara el contrato completo."
          else
            echo "Sin BOOKING_REMINDER_CRON_SECRET: se despliega y se verifica que el endpoint rechace sin credenciales."
          fi

      - name: Install and test
        run: |
          npm ci
          node --test workers/booking-reminder-cron/tests/worker.test.js
          node --check workers/booking-reminder-cron/worker.js

      - name: Deploy Worker and activate Cron Trigger
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@"$WRANGLER_VERSION" deploy             --config workers/booking-reminder-cron/wrangler.toml
          # Solo si se pidio rotar. El Worker conserva sus secretos entre despliegues, asi que
          # esto no hace falta para publicar un cambio de codigo.
          if [ -n "$BOOKING_REMINDER_CRON_SECRET" ]; then
            printf '%s' "$BOOKING_REMINDER_CRON_SECRET" |
              npx --yes wrangler@"$WRANGLER_VERSION" secret put BOOKING_REMINDER_CRON_SECRET                 --config workers/booking-reminder-cron/wrangler.toml
          fi

      - name: Verify endpoint contract against Render (ssc.dalfistudio.com)
        shell: bash
        run: |
          set -euo pipefail
          unauthorized_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             --request POST "$APP_BASE_URL/api/booking/send-reminders")"
          test "$unauthorized_status" = "401"

          # La otra mitad -- que el secreto del Worker y el del ERP coincidan de verdad -- solo se
          # puede comprobar teniendolo. Sin el se avisa en vez de fallar: un workflow siempre rojo
          # es lo mismo que no tener workflow, porque nadie lo mira.
          if [ -z "$BOOKING_REMINDER_CRON_SECRET" ]; then
            echo "Desplegado y protegido (401 sin credenciales). No se verifico que el secreto coincida: anade BOOKING_REMINDER_CRON_SECRET a los secretos del repo si quieres esa comprobacion."
            exit 0
          fi

          response_file="$(mktemp)"
          authenticated_status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}'             --request POST "$APP_BASE_URL/api/booking/send-reminders"             --header "x-cron-secret: $BOOKING_REMINDER_CRON_SECRET")"
          test "$authenticated_status" = "200"
          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (body.ok !== true || !Array.isArray(body.failures)) {
              throw new Error("Respuesta inesperada del endpoint de recordatorios.");
            }
            console.log(JSON.stringify({
              ok: body.ok,
              remindersSent: body.remindersSent,
              escalationsSent: body.escalationsSent,
              failureCount: body.failures.length
            }));
          ' "$response_file"

          npx --yes wrangler@"$WRANGLER_VERSION" secret list             --config workers/booking-reminder-cron/wrangler.toml |
            grep -q BOOKING_REMINDER_CRON_SECRET
